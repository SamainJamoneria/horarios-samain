<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios Samaín</title>
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" href="icono.png">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 5px; color: #333; }
        
        #pantalla-login {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .login-card {
            background: white; padding: 25px; border-radius: 8px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 85%; max-width: 300px;
        }
        .login-card h3 { margin-top: 0; color: #2c3e50; font-size: 1.2rem; }
        .login-card input { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; text-align: center; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        .login-card button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .container { width: 100%; max-width: 100%; margin: auto; background: white; padding: 10px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box; display: none; }
        h2 { text-align: center; color: #2c3e50; font-size: 1.1rem; margin-top: 5px; margin-bottom: 10px; }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        button { background-color: #27ae60; color: white; border: none; padding: 8px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; flex: 1; font-size: 0.85rem; min-width: 110px; }
        button.btn-pdf { background-color: #e74c3c; }
        button.btn-add { background-color: #2980b9; }
        button:active { opacity: 0.8; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; min-width: 750px; table-layout: auto; }
        th, td { border: 1px solid #ddd; padding: 4px; text-align: center; font-size: 0.75rem; vertical-align: middle; }
        th { background-color: #2c3e50; color: white; padding: 6px 4px; }
        
        /* Forzar que la columna Empleado y los días tengan proporciones equilibradas y más espacio */
        th:first-child, td:first-child { width: 16%; min-width: 130px; }
        th:not(:first-child):not(.no-print), td:not(:first-child):not(.no-print) { width: 10%; }

        .empleado-cell { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.7); padding: 2px; border-radius: 3px; }
        
        /* Permitir que el input del nombre se expanda dinámicamente según el contenido */
        .empleado-input { font-weight: bold; border: 1px solid #ccc; border-radius: 3px; padding: 4px 6px; text-align: left; flex: 1; font-size: 0.75rem; width: 100%; box-sizing: border-box; }
        
        .horas-container { display: flex; align-items: center; gap: 2px; background: #fff; padding: 2px 4px; border-radius: 3px; border: 1px solid #ddd; flex-shrink: 0; }
        .total-horas { font-size: 0.7rem; color: #555; white-space: nowrap; font-weight: bold; }
        .btn-eye-horas { background: transparent; border: none; cursor: pointer; font-size: 0.75rem; padding: 0; min-width: auto; line-height: 1; }
        
        /* Textarea para horarios partidos */
        td textarea { 
            width: 95%; 
            height: 38px; 
            padding: 4px 2px; 
            text-align: center; 
            border: 1px solid #ccc; 
            border-radius: 3px; 
            font-size: 0.75rem; 
            box-sizing: border-box; 
            resize: none; 
            font-family: Arial, sans-serif;
            line-height: 1.2;
        }
        
        .btn-eye { background: transparent; border: none; cursor: pointer; font-size: 0.9rem; padding: 2px; min-width: auto; flex: 0; }
        .btn-delete { background: #e74c3c; color: white; border: none; border-radius: 3px; padding: 4px 6px; cursor: pointer; font-size: 0.7rem; min-width: auto; flex: 0; }
        .btn-delete:hover { background: #c0392b; }
        
        .export-toggle-container { margin-bottom: 8px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; background: #f8f9fa; padding: 6px; border-radius: 4px; border: 1px solid #e9ecef; }
        
        /* Forzar formato horizontal (landscape) al imprimir / exportar a PDF */
        @page { size: landscape; margin: 8mm; }

        @media print {
            body { background: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .container { box-shadow: none; padding: 0; width: 100%; display: block !important; }
            #pantalla-login { display: none !important; }
            .controls, button, .no-print, .btn-eye-horas { display: none !important; }
            
            tr.fila-oculta-pdf { display: none !important; }
            
            body:not(.exportar-total-activo) .col-total-horas { display: none !important; }
            body:not(.exportar-total-activo) .horas-container:not(.horas-exportables-activo) { display: none !important; }

            table { font-size: 0.85rem; width: 100%; min-width: 100%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            th, td { padding: 8px 4px; }
            th:first-child, td:first-child { width: 18%; }
            th { background-color: #2c3e50 !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            tr { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            td input.empleado-input { border: none; background: transparent !important; font-weight: bold; font-size: 0.85rem; }
            td textarea { border: none; background: transparent !important; font-weight: bold; font-size: 0.85rem; resize: none; height: auto; overflow: visible; white-space: pre-wrap; }
        }
    </style>
</head>
<body>

<div id="pantalla-login">
    <div class="login-card">
        <h3>Horarios Samaín</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">Introduce la contraseña para acceder</p>
        <input type="password" id="input-password" placeholder="Contraseña" autocomplete="current-password">
        <button onclick="verificarPassword()">Entrar</button>
    </div>
</div>

<div class="container" id="app-container">
    <h2>Horario Semanal - Samaín</h2>
    
    <div class="controls">
        <button class="btn-add" onclick="agregarEmpleado()">+ Añadir Empleado</button>
        <button onclick="limpiarHorario()">Borrar Todo</button>
        <button class="btn-pdf" onclick="prepararPDF()">Guardar / PDF</button>
    </div>

    <div class="export-toggle-container no-print">
        <label>
            <input type="checkbox" id="chk-exportar-total" onchange="toggleExportarTotal(this)"> 
            Incluir columna general de Total de Horas en el PDF
        </label>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                    <th>Sábado</th>
                    <th>Domingo</th>
                    <th class="col-total-horas" style="display:none;">Total Horas</th>
                    <th class="no-print" style="width: 60px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-horarios">
            </tbody>
        </table>
    </div>
</div>

<script>
    const CLISECRETA = "1494";

    function verificarPassword() {
        let pass = document.getElementById("input-password").value;
        if (pass === CLISECRETA) {
            document.getElementById("pantalla-login").style.display = "none";
            document.getElementById("app-container").style.display = "block";
            sessionStorage.setItem("sesion_activa", "true");
        } else {
            alert("Contraseña incorrecta");
            document.getElementById("input-password").value = "";
        }
    }

    document.getElementById("input-password").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            verificarPassword();
        }
    });

    window.onload = function() {
        if (sessionStorage.getItem("sesion_activa") === "true") {
            document.getElementById("pantalla-login").style.display = "none";
            document.getElementById("app-container").style.display = "block";
        }
    };

    function toggleExportarTotal(checkbox) {
        if (checkbox.checked) {
            document.body.classList.add("exportar-total-activo");
            document.querySelectorAll(".col-total-horas").forEach(el => el.style.display = "");
        } else {
            document.body.classList.remove("exportar-total-activo");
            document.querySelectorAll(".col-total-horas").forEach(el => el.style.display = "none");
        }
    }

    function prepararPDF() {
        let chk = document.getElementById("chk-exportar-total");
        if (chk.checked) {
            document.body.classList.add("exportar-total-activo");
            document.querySelectorAll(".col-total-horas").forEach(el => el.style.display = "");
        } else {
            document.body.classList.remove("exportar-total-activo");
            document.querySelectorAll(".col-total-horas").forEach(el => el.style.display = "none");
        }
        window.print();
    }
</script>

<script src="script.js"></script>
</body>
</html>
