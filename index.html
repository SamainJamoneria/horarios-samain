<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios Samaín</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 5px; color: #333; }
        .container { width: 100%; max-width: 100%; margin: auto; background: white; padding: 10px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { text-align: center; color: #2c3e50; font-size: 1.1rem; margin-top: 5px; margin-bottom: 10px; }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; }
        button { background-color: #27ae60; color: white; border: none; padding: 8px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; flex: 1; font-size: 0.85rem; }
        button.btn-pdf { background-color: #e74c3c; }
        button:active { opacity: 0.8; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; min-width: 550px; }
        th, td { border: 1px solid #ddd; padding: 4px; text-align: center; font-size: 0.75rem; }
        th { background-color: #2c3e50; color: white; padding: 6px 4px; }
        td input { width: 95%; padding: 6px 2px; text-align: center; border: 1px solid #ccc; border-radius: 3px; font-size: 0.75rem; box-sizing: border-box; }
        .empleado-input { font-weight: bold; text-align: left !important; background: #f8f9fa; padding-left: 4px; }
        
        /* Estilos para cuando se imprima o guarde en PDF */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .controls, button { display: none !important; }
            table { font-size: 0.7rem; min-width: 100%; }
            td input { border: none; background: transparent; font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Horario Semanal - Samaín</h2>
    
    <div class="controls">
        <button onclick="limpiarHorario()">Borrar Todo</button>
        <button class="btn-pdf" onclick="window.print()">Guardar / PDF</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                    <th>Sábado</th>
                    <th>Domingo</th>
                </tr>
            </thead>
            <tbody id="tabla-horarios">
                <!-- Se genera mediante script.js -->
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
